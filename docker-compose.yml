services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline
      MYSQL_USER: airline_app
      MYSQL_PASSWORD: airline_dev
    ports:
      - "3306:3306"
    volumes:
      - airline_mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      AIRLINE_DB_URL: jdbc:mysql://database:3306/airline?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      AIRLINE_DB_USER: airline_app
      AIRLINE_DB_PASSWORD: airline_dev
    ports:
      - "8080:8080"

volumes:
  airline_mysql:
